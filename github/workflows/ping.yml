name: Keep Render Awake

on:
  schedule:
    - cron: "*/7 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render
        run: |
          URL="${{ secrets.RENDER_URL }}"
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$URL")
            echo "Attempt $i -> HTTP $code"
            if [ "$code" = "200" ] || [ "$code" = "403" ] || [ "$code" = "302" ]; then
              exit 0
            fi
            sleep 5
          done
